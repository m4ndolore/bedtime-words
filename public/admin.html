<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Admin · Bedtime Words</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="stylesheet" href="/css/page.css">
</head>
<body>
  <main>
    <a class="back" href="/">← Bedtime words</a>
    <h1>shared affirmations</h1>
    <p class="note" id="who"></p>
    <div class="tabs" role="group" aria-label="Show">
      <button type="button" data-status="pending" aria-pressed="true">Waiting</button>
      <button type="button" data-status="approved" aria-pressed="false">Approved</button>
      <button type="button" data-status="rejected" aria-pressed="false">Rejected</button>
    </div>
    <p class="note" id="status" role="status"></p>
    <div id="list"></div>
    <h2>visits by link</h2>
    <p class="note">Share <b>affirmations.buildwith.dad/go/&lt;name&gt;</b> with a different name per place (class, x, hn, family). Each visit counts once; link-preview bots do not.</p>
    <table class="channels"><thead><tr><th>Link</th><th>Last 7 days</th><th>All time</th><th>Last visit</th></tr></thead><tbody id="channels"></tbody></table>
  </main>
  <script src="/js/admin.js" defer></script>
</body>
</html>
