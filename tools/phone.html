<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bedtime Words on a phone</title>
<!-- The app in an iframe, framed like an iPhone 16 Pro (393x852 points) at 2x, on a 1080x1920 canvas.
     tools/record-demo.js records this page; ?src= is the app's URL. -->
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 30%, #2c3350 0%, #161a28 70%); }
  .phone {
    position: absolute; left: 133px; top: 94px; width: 407px; height: 866px;
    transform: scale(2); transform-origin: 0 0;
    border-radius: 62px; background: #0c0c0e;
    box-shadow: 0 0 0 1.5px #3b3d44, 0 30px 60px #0008;
  }
  .screen {
    position: absolute; inset: 7px; border-radius: 55px; overflow: hidden; background: #1d2232;
  }
  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 54px;
    font: 600 17px/1 -apple-system, "SF Pro Text", system-ui, sans-serif; color: #f4efe3;
  }
  .time { position: absolute; left: 54px; top: 20px; letter-spacing: -0.2px; }
  .island { position: absolute; left: 133.5px; top: 11px; width: 126px; height: 37px; border-radius: 19px; background: #000; z-index: 2; }
  .icons { position: absolute; right: 30px; top: 19px; display: flex; gap: 6px; align-items: center; }
  iframe { position: absolute; top: 54px; left: 0; width: 393px; height: 764px; border: 0; }
  .home { position: absolute; bottom: 8px; left: 129.5px; width: 134px; height: 5px; border-radius: 3px; background: #f4efe3; z-index: 2; pointer-events: none; }
  .tap {
    position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%;
    background: #ffffff66; border: 3px solid #ffffffcc; box-shadow: 0 0 0 2px #0002;
    pointer-events: none; z-index: 5; animation: tap 520ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }
  @keyframes tap { from { transform: scale(0.5); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status">
      <span class="time">9:41</span>
      <div class="island"></div>
      <div class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#f4efe3"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="#f4efe3"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.2-1.3A10.5 10.5 0 0 0 8 .8 10.5 10.5 0 0 0 .8 3.7L2 5c1.6-1.5 3.7-2.4 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.8 6.8 0 0 0 8 4.4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c.5 0 .9.2 1.2.4L8 11.4 6.8 10.1c.3-.2.7-.4 1.2-.4Z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#f4efe3" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#f4efe3"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#f4efe3" opacity=".45"/></svg>
      </div>
    </div>
    <iframe id="app" title="Bedtime Words"></iframe>
    <div class="home"></div>
  </div>
</div>
<script>
  document.getElementById('app').src = new URLSearchParams(location.search).get('src');

  /* A ripple where a finger touches, in page pixels. */
  window.showTap = (x, y) => {
    const dot = document.createElement('div');
    dot.className = 'tap';
    dot.style.left = `${x}px`;
    dot.style.top = `${y}px`;
    document.body.append(dot);
    setTimeout(() => dot.remove(), 600);
  };
</script>
</body>
</html>
